name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find Project and Build APK
      run: |
        # build.gradle.kts dosyasının olduğu gerçek klasörü bul ve oraya git
        TARGET_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
        echo "Proje klasörü bulundu: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        # Eğer gradlew dosyası yoksa oluştur
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/*.apk"
