name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK with Gradle
      run: |
        PROJ_DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
        if [ -n "$PROJ_DIR" ]; then
          cd "$PROJ_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "gradlew dosyası bulunamadı!" && exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/*.apk"
