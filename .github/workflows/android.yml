name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Kotlin Line and Build APK
      run: |
        cd PhotoScannerByOmerNGS
        
        # 1. JVM doğrulama engelini kaldır
        if [ ! -f "gradle.properties" ]; then
          touch gradle.properties
        fi
        echo "kotlin.jvm.target.validation.mode=IGNORE" >> gradle.properties
        
        # 2. build.gradle dosyalarındaki Java versiyonlarını güncelle
        find . -name "build.gradle*" -exec sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/"1.8"/"17"/g' {} +
        find . -name "build.gradle*" -exec sed -i "s/'1.8'/'17'/g" {} +
        
        # 3. MainActivity.kt 57. satırdaki hatalı 'singleLine' geçen kısmı güvenli şekilde yorum satırına al
        sed -i '57s/singleLine/\/\/ singleLine/' app/src/main/java/com/omerngs/photoscanner/MainActivity.kt || true
        
        # 4. Wrapper oluştur ve APK derle
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/*.apk"
