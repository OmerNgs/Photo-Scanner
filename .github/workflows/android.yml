
name: Android CI

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Android APK
        run: |
          PROJECT_DIR="PhotoScannerByOmerNGS"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "HATA: Android proje kökü bulunamadı."
            exit 1
          fi

          echo "Proje kökü: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: PhotoScannerByOmerNGS/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
